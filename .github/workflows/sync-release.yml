# Mirrors an enyo/dropzone release into this repo so Packagist can serve it.
#
# This repo only ever writes to itself and reads a public release, so the
# built-in GITHUB_TOKEN is enough and there is no cross-repo secret to expire.
# The trade-off is that nothing pushes to us when a release goes out: this
# schedule is the only thing that notices one, so it runs hourly.
#
# ⚠️ GitHub disables scheduled workflows in public repositories after 60 days
# without repository activity, and the only activity here is a sync. If
# dropzone goes more than 60 days between releases, this workflow is switched
# off silently and the release after that will NOT sync on its own. After a
# quiet stretch, check that it still says "active" under Actions and use "Run
# workflow" to catch up.
name: Sync Dropzone Release

on:
  # Deliberately not on the hour: runs queued at peak times are delayed, and
  # sometimes dropped entirely.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (defaults to the latest)"
        required: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync the latest release
    runs-on: ubuntu-latest
    steps:
      # Answered without cloning anything, so the 23 runs a day that have
      # nothing to do cost a couple of seconds each.
      - name: Work out whether there is anything to do
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          release="${INPUT_TAG:-$(gh release view --repo enyo/dropzone --json tagName --jq .tagName)}"

          # Packagist derives the package version from the tag name, so ours
          # has to be a bare version whatever upstream calls its own tag.
          # Upstream tags v<version>, but changesets switches to
          # <name>@<version> whenever the workspace holds more than one
          # package, and Packagist cannot read that as a version at all.
          version="${release##*@}"
          version="${version#v}"
          tag="v$version"

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Could not read a version out of the upstream tag '$release'."
            exit 1
          fi

          if git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/$tag" > /dev/null 2>&1; then
            echo "$tag is already synced, nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$release is new, syncing it as $tag."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout packagist repo
        if: steps.release.outputs.needed == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Dropzone at that tag
        if: steps.release.outputs.needed == 'true'
        uses: actions/checkout@v7
        with:
          repository: enyo/dropzone
          ref: ${{ steps.release.outputs.release }}
          path: source

      - name: Replace dist from the release asset
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.release }}
        run: |
          gh release download "$TAG" \
            --repo enyo/dropzone \
            --pattern dist.zip \
            --clobber

          rm -rf dist
          unzip -q dist.zip
          rm dist.zip

          # dropzone became a monorepo, so the library moved to
          # packages/dropzone. Releases tagged before that still have these at
          # the repository root, and this workflow has to be able to sync
          # either.
          if [ -f source/packages/dropzone/package.json ]; then
            library=source/packages/dropzone
          else
            library=source
          fi
          cp "$library/package.json" .
          cp "$library/CHANGELOG.md" .
          rm -rf source

      - name: Commit and tag
        if: steps.release.outputs.needed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: master
          commit_message: "${{ steps.release.outputs.tag }} Release"
          tagging_message: ${{ steps.release.outputs.tag }}
          commit_user_name: Dropzone Drone
          commit_user_email: drone@dropzone.dev
